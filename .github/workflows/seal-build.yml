name: seal-build

# Seal fork CI for the npm `jquery@1.7.2` release. That tarball is not packed
# from this repo: it is the node-jquery wrapper (vendored under node-jquery/)
# with tmp/jquery.js = this repo's `make` output and lib/node-jquery.js = the
# wrapper's own `grunt build` of it. Upstream has no GitHub Actions CI; the
# build/test commands below are the project's own (Makefile, test/index.html
# QUnit suite) and the wrapper's (grunt.js build/server/test), run on the
# release-time toolchain (Node 0.6.14 / npm 1.1.12).

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "QUnit filter (substring of 'module: test name'); empty runs the full suite"
        required: false
        default: ""

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .gitmodules points at dead git:// URLs; materialize the pinned
      # submodule commits over https when the directories are empty.
      - name: Materialize submodules (sizzle, qunit) at pinned SHAs
        shell: bash
        run: |
          set -euo pipefail
          materialize() {
            local url="$1" sha="$2" dest="$3"
            mkdir -p "$dest"
            if [ -n "$(ls -A "$dest")" ]; then
              echo "$dest already populated; leaving it as is"
              return 0
            fi
            local tmp
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" remote add origin "$url"
            git -C "$tmp" fetch -q --depth 1 origin "$sha"
            git -C "$tmp" checkout -q FETCH_HEAD
            echo "$dest @ $(git -C "$tmp" rev-parse HEAD)"
            rm -rf "$tmp/.git"
            cp -a "$tmp/." "$dest/"
            rm -rf "$tmp"
          }
          materialize https://github.com/jquery/sizzle.git fe2f618106bb76857b229113d6d11653707d0b22 src/sizzle
          materialize https://github.com/jquery/qunit.git 0712230bb203c262211649b32bd712ec7df5f857 test/qunit
          test -f src/sizzle/sizzle.js
          test -f test/qunit/qunit/qunit.js
          ls -la src/sizzle test/qunit

      # npm 1.1 on Node 0.6 cannot speak TLS to today's registries, so the
      # wrapper's dependencies are fetched with a modern npm (pinned to the
      # release date via the time machine); everything else runs on Node 0.6.
      - name: Set up Node 16 (dependency fetch only)
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install node-jquery dependencies (time machine)
        shell: bash
        working-directory: node-jquery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          printf '%s\n' \
            'registry=https://time-machines-npm.sealsecurity.io/' \
            '//time-machines-npm.sealsecurity.io/:_authToken=2012-05-01T11:14:09.090000Z' \
            > "$RUNNER_TEMP/seal/npmrc"
          npm install --userconfig "$RUNNER_TEMP/seal/npmrc" --ignore-scripts --no-package-lock --no-audit --no-fund
          for p in jsdom htmlparser xmlhttprequest contextify grunt nodeunit; do
            node -e "var p = require('./node_modules/$p/package.json'); console.log(p.name + '@' + p.version)"
          done

      - name: Write container scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          cat > "$RUNNER_TEMP/seal/node06.sh" <<'SEAL_NODE_EOF'
          set -euo pipefail
          sed -i 's|^mirrorlist|#mirrorlist|g' /etc/yum.repos.d/CentOS-*.repo
          sed -i 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
          yum install -y -q gcc gcc-c++ make python openssl-devel
          curl -fsSL https://nodejs.org/dist/v0.6.14/node-v0.6.14.tar.gz | tar xz -C /tmp
          cd /tmp/node-v0.6.14
          ./configure --prefix=/seal/node06
          make -j"$(nproc)"
          make install
          export PATH=/seal/node06/bin:$PATH
          echo "node $(node -v), npm $(npm -v)"
          chown -R "$HOST_UID:$HOST_GID" /seal
          SEAL_NODE_EOF
          cat > "$RUNNER_TEMP/seal/build.sh" <<'SEAL_BUILD_EOF'
          set -euo pipefail
          sed -i 's|^mirrorlist|#mirrorlist|g' /etc/yum.repos.d/CentOS-*.repo
          sed -i 's|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*.repo
          # which: the Makefile finds its JS engine via `which node`
          # gcc-c++/python: node-waf build of jsdom's native contextify
          yum install -y -q make gcc-c++ python which
          export PATH=/seal/node06/bin:$PATH
          echo "node $(node -v), npm $(npm -v)"
          cd /work
          echo "=== jQuery build: make core (Node $(node -v)) ==="
          make core DATE="Wed Mar 21 12:46:34 2012 -0700"
          ls -la dist src/selector.js
          cmp dist/jquery.js jquery.js
          echo "dist/jquery.js is byte-identical to the repository's release jquery.js"
          cd /work/node-jquery
          # grunt build reads tmp/jquery.js and writes lib/node-jquery.js
          # (it only downloads jquery.js when tmp/jquery.js is missing).
          mkdir tmp lib
          cp ../dist/jquery.js tmp/jquery.js
          echo "=== node-jquery: grunt build ==="
          ./node_modules/.bin/grunt build
          ls -la lib tmp
          echo "=== contextify (jsdom native dep): node-waf configure build ==="
          (cd node_modules/contextify && node-waf configure build)
          node -e "require('contextify'); console.log('contextify loads')"
          # grunt.js `test` = nodeunit over test/*.js; `server` serves
          # test/fixtures on :8000 for test/xmlhttp.js (= the `http_test` task).
          echo "=== node-jquery tests: grunt server test (Node $(node -v)) ==="
          timeout 600 ./node_modules/.bin/grunt server test --verbose
          echo "=== npm pack (npm $(npm -v)) ==="
          npm pack
          tar tzvf jquery-1.7.2.tgz
          echo "member count: $(tar tzf jquery-1.7.2.tgz | wc -l)"
          chown -R "$HOST_UID:$HOST_GID" /work /seal
          SEAL_BUILD_EOF

      - name: Compile Node 0.6.14 (centos:7)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$RUNNER_TEMP/seal:/seal" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            centos:7 bash /seal/node06.sh
          test -x "$RUNNER_TEMP/seal/node06/bin/node"

      - name: Build, test node-jquery, pack (Node 0.6.14 / npm 1.1.12)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/seal:/seal" \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            centos:7 bash /seal/build.sh
          test -f src/selector.js
          test -f node-jquery/jquery-1.7.2.tgz

      - name: Set up Node 20 (QUnit browser driver)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless browser driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/driver"
          cd "$RUNNER_TEMP/driver"
          npm init -y
          npm install puppeteer-core@22 --no-audit --no-fund

      - name: Locate Chrome and PHP
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="${CHROME_BIN:-$(command -v google-chrome)}"
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          php --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      # The project's real unit suite: test/index.html (QUnit, incl. Sizzle's
      # selector tests), served by PHP for the ajax fixtures and
      # data/include_js.php, in headless Chrome.
      - name: Run QUnit test suite (headless Chrome)
        shell: bash
        env:
          SEAL_TEST_FILTER: ${{ inputs.test-filter }}
          # Environment-dependent in modern headless Chrome (not jQuery bugs):
          # - css widows/orphans: Chrome rejects 0 (CSS Fragmentation needs a
          #   positive integer) and reports its default "2".
          # - effects queue:'name': #qunit-fixture (QUnit 1.3 css) is an
          #   unsized absolute box whose shrink-to-fit width drifts 15px
          #   during the 100ms wait after earlier effects tests; the test
          #   passes in isolation (an animation start would add 100px).
          # - offset fractions: Blink snaps layout to 1/64 px (999.984375).
          SEAL_SKIP_TESTS: >-
            css: widows & orphans #8936||
            effects: animate option { queue: 'name' }||
            offset: fractions (see #7730 and #7885)
        run: |
          set -euo pipefail
          # Multiple workers: a single-process php -S starves the fixture
          # iframes the suite opens.
          PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > "$RUNNER_TEMP/php.log" 2>&1 &
          PHP_PID=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/test/index.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "PHP server did not come up"
            cat "$RUNNER_TEMP/php.log"
            exit 1
          fi
          status=0
          NODE_PATH="$RUNNER_TEMP/driver/node_modules" \
            node test/seal-browser-runner.js "http://127.0.0.1:8000/test/index.html" \
            || status=$?
          if kill -0 "$PHP_PID" 2>/dev/null; then
            kill "$PHP_PID"
          fi
          if [ "$status" -ne 0 ]; then
            echo "--- php.log (tail) ---"
            tail -n 100 "$RUNNER_TEMP/php.log"
          fi
          exit "$status"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jquery-npm
          path: node-jquery/jquery-1.7.2.tgz
          if-no-files-found: error
